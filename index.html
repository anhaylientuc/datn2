<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="container">
    <ul id="board"></ul>
  </div>
  <div id="menu">
    <button id="btn-findgame">Find game</button>
    <button id="btn-login">Login</button>
    <button id="btn-logout">Logout</button>
  </div>

  <!-- Các module để cuối body -->
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module">
    import { db,auth } from "./js/firebase.js";
    import { login, logout } from "./js/auth.js";
    import {findGame} from "./js/matching.js";
    // DOM đã parse xong nên lấy được nút
    const btnLogin = document.getElementById("btn-login");
    const btnLogout = document.getElementById("btn-logout");
    const btnFindgame = document.getElementById("btn-findgame");
    btnLogin.addEventListener("click", login);
    btnLogout.addEventListener("click", async()=>{await logout()});
    btnFindgame.addEventListener("click",()=>{
        if(auth){
            findGame({db,auth});
        }
    });
  </script>
</body>
</html>
